<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>call note form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Century+Gothic&display=swap');

    body {
      background-color: #000;
      color: #fff;
      font-family: 'Century Gothic', sans-serif;
      margin: 0;
      padding: 20px;
    }

    .container {
      background-color: #111;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      width: 90%;
      max-width: 500px;
      margin: 0 auto;
      box-sizing: border-box;
    }

    label, select, input, textarea {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      background-color: #222;
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 5px;
      font-family: 'Century Gothic', sans-serif;
      box-sizing: border-box;
    }

    label {
      background: none;
      padding: 0;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      background-color: #444;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-family: 'Century Gothic', sans-serif;
    }

    button:hover {
      background-color: #666;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.8);
    }

    .modal-content {
      background-color: #111;
      margin: 15% auto;
      padding: 20px;
      width: 90%;
      max-width: 500px;
      border-radius: 10px;
    }

    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      cursor: pointer;
    }

    .close:hover {
      color: #fff;
    }

    .error {
      color: #ff6b6b;
      font-size: 0.9rem;
      margin: 6px 0;
    }

    textarea#resolutionText {
      min-height: 60px;
      resize: vertical;
      line-height: 1.4;
      white-space: pre-wrap;
      overflow: hidden;
    }

    textarea#output {
      height: 160px;
      resize: none;
      overflow: auto;
      background-color: #222;
      color: #fff;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- NEW: agt name -->
    <label for="agentName">agt name:</label>
    <input type="text" id="agentName">

    <!-- NEW: agt id -->
    <label for="agentId">agt id:</label>
    <input type="text" id="agentId">

    <label for="speakingTo">agt speaking to:</label>
    <select id="speakingTo">
      <option value="">-- select an option --</option>
      <option value="alexa (ai)">alexa (ai)</option>
      <option value="cms test caller">cms test caller</option>
      <option value="member">member</option>
      <option value="parent of minor">parent</option>
      <option value="pharmacy">pharmacy</option>
      <option value="plan">plan</option>
      <option value="provider">provider</option>
      <option value="spouse">spouse</option>
      <option value="third party">third party</option>
    </select>
    <div id="speakingToError" class="error"></div>

    <label for="agent">agt call regarding:</label>
    <input type="text" id="agent">

    <label for="rx">rx:</label>
    <input type="text" id="rx">

    <label for="resolutionDropdown">res: advised agt to</label>
    <select id="resolutionDropdown">
      <option value="">-- select an option --</option>
      <option>check/apply override per psa j/a</option>
      <option>check eligibility</option>
      <option>check pharm network</option>
      <option>check quantity limits</option>
      <option>confirm coverage</option>
      <option>create pr case per j/a</option>
      <option>escalation/xfer caller</option>
      <option>explore alternative medication options</option>
      <option>inform of formulary exception/coverage exception</option>
      <option>initiate/fax forms for prior authorization</option>
      <option>review prior authorization status</option>
      <option>reach out to clinical regarding prior authorization</option>
      <option>review accumulators</option>
      <option>review/resolve claim reject</option>
      <option>verify costshare details via benefits</option>
    </select>

    <textarea id="resolutionText" placeholder="additional notes"></textarea>

    <div class="button-row">
      <button onclick="generateNote()">submit</button>
      <button onclick="clearForm()">cancel</button>
    </div>
  </div>

  <div id="noteModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <textarea id="output" readonly></textarea>
      <div class="button-row">
        <button onclick="copyNote()">copy</button>
        <button onclick="resetPage()">reset</button>
      </div>
    </div>
  </div>

  <script>
    function autoExpand(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }

    function generateNote() {
      const speakingTo = document.getElementById('speakingTo');
      const error = document.getElementById('speakingToError');

      if (!speakingTo.value) {
        error.textContent = 'please select who the agt is speaking to.';
        return;
      }
      error.textContent = '';

      const agentName = document.getElementById('agentName').value;
      const agentId = document.getElementById('agentId').value;
      const agent = document.getElementById('agent').value;
      const rx = document.getElementById('rx').value;
      const resolutionDropdown = document.getElementById('resolutionDropdown').value;
      const resolutionText = document.getElementById('resolutionText').value;
      const resolutionSuffix = resolutionText ? `/ ${resolutionText}` : '';

      const note = `agt name&id: ${agentName} / ${agentId}
agt speaking to: ${speakingTo.value}
agt call regarding: ${agent}
rx: ${rx}
res: advised agt to ${resolutionDropdown}${resolutionSuffix}`;

      document.getElementById('output').value = note;
      document.getElementById('noteModal').style.display = 'block';
    }

    function copyNote() {
      const output = document.getElementById('output');
      output.select();
      document.execCommand('copy');
    }

    function clearForm() {
      document.querySelectorAll('input, textarea').forEach(el => el.value = '');
      document.getElementById('speakingTo').selectedIndex = 0;
      document.getElementById('resolutionDropdown').selectedIndex = 0;
      document.getElementById('speakingToError').textContent = '';
    }

    function resetPage() {
      location.reload();
    }

    function closeModal() {
      document.getElementById('noteModal').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const notes = document.getElementById('resolutionText');
      autoExpand(notes);
      notes.addEventListener('input', () => autoExpand(notes));
    });
  </script>
</body>
</html>
