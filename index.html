
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>call note form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Century+Gothic&display=swap');
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Century Gothic', sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container {
      background-color: #111;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      width: 90%;
      max-width: 500px;
      margin: 0 auto;
      box-sizing: border-box;
    }
    label, select, input, textarea {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      background-color: #222;
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 5px;
      font-family: 'Century Gothic', sans-serif;
      box-sizing: border-box;
    }
    .button-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }
    button {
      background-color: #444;
      color: #fff;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-family: 'Century Gothic', sans-serif;
    }
    button:hover {
      background-color: #666;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.8);
    }
    .modal-content {
      background-color: #111;
      margin: 15% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 90%;
      max-width: 500px;
      border-radius: 10px;
      color: #fff;
      font-family: 'Century Gothic', sans-serif;
      box-sizing: border-box;
    }
    .close {
      color: #aaa;
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }
    .close:hover,
    .close:focus {
      color: #fff;
      text-decoration: none;
    }
    .error {
      color: #ff6b6b;
      font-size: 0.9rem;
      margin: 6px 0;
    }

    /* Additional notes: auto-expand while typing (simple labeled typing area) */
    textarea#resolutionText {
      min-height: 100px;        /* comfortable starting height */
      resize: vertical;         /* allow manual vertical resize if desired */
      line-height: 1.4;
      white-space: pre-wrap;    /* preserve newlines, wrap long lines */
      word-wrap: break-word;
      overflow: hidden;         /* hide scrollbar; height expands to fit */
    }

    /* Output textarea: fixed height with scrollbar (no auto-expand) */
    textarea#output {
      height: 160px;            /* fixed preview height */
      overflow: auto;           /* scroll within the box */
      line-height: 1.4;
      white-space: pre-wrap;
      word-wrap: break-word;
      background-color: #222;
      border: none;
      color: #fff;
      padding: 8px;
      border-radius: 5px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="container">
    <label for="agentId">agt id:</label>
    <input type="text" id="agentId">

    <!-- agt speaking to: placeholder and validation -->
    <label for="speakingTo">agt speaking to:</label>
    <select id="speakingTo">
      <option value="">-- select an option --</option>
      <!-- alphabetized list -->
      <option value="alexa (ai)">alexa (ai)</option>
      <option value="authorized representative">authorized representative</option>
      <option value="cms test caller">cms test caller</option>
      <option value="covermymeds representative">covermymeds representative</option>
      <option value="dte client group">dte client group</option>
      <option value="member">member</option>
      <option value="parent of minor">parent of minor</option>
      <option value="pharmacy">pharmacy</option>
      <option value="plan">plan</option>
      <option value="poa">poa</option>
      <option value="prime vendor">prime vendor</option>
      <option value="provider">provider</option>
      <option value="spouse">spouse</option>
      <option value="third party">third party</option>
    </select>
    <div id="speakingToError" class="error" aria-live="polite"></div>

    <label for="agent">agt call regarding:</label>
    <input type="text" id="agent">

    <label for="rx">rx:</label>
    <input type="text" id="rx">

    <label for="resolutionDropdown">res: advised agt to</label>
    <select id="resolutionDropdown">
      <option value="">-- select an option --</option>
      <option>check/apply override per psa j/a</option>
      <option>check mbr eligibility</option>
      <option>check pharm network</option>
      <option>check quantity limits on rx</option>
      <option>confirm coverage for rx</option>
      <option>create pr case per j/a</option>
      <option>explore alternative medication options</option>
      <option>inform of formulary exception/coverage exception</option>
      <option>initiate a call/callback</option>
      <option>initiate/fax forms for prior authorization</option>
      <option>review prior authorization denial reasoning</option>
      <option>reach out to clinical regarding prior authorization for rx</option>
      <option>review accumulators (deductible and out-of-pocket)</option>
      <option>review/resolve claim reject</option>
      <option>verify copay/coinsurance details via benefits</option>
      <option>xfer caller</option>
    </select>

    <!-- Additional notes: same simple labeled typing area, auto-expand as you type -->
    <label for="resolutionText">additional notes</label>
    <textarea id="resolutionText" placeholder="add context, steps taken, names, times, etc."></textarea>

    <div class="button-row">
      <button onclick="generateNote()">submit</button>
      <button onclick="clearForm()">cancel</button>
    </div>
  </div>

  <div id="noteModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <textarea id="output" readonly></textarea>
      <div class="button-row">
        <button onclick="copyNote()">copy</button>
        <button onclick="resetPage()">reset</button>
      </div>
    </div>
  </div>

  <script>
    // Auto-expand notes textarea to fit content (output does NOT auto-expand)
    function autoExpand(el) {
      if (!el) return;
      el.style.height = 'auto';                 // reset height
      el.style.height = el.scrollHeight + 'px'; // set to content height
    }

    function generateNote() {
      // Validate ONLY the "agt speaking to" placeholder
      const speakingToSelect = document.getElementById('speakingTo');
      const speakingToError = document.getElementById('speakingToError');
      if (speakingToSelect.value === '') {
        speakingToError.textContent = 'please select who the agt is speaking to.';
        speakingToSelect.focus();
        return; // Stop submission
      } else {
        speakingToError.textContent = '';
      }

      const agent = document.getElementById('agent').value;
      const agentId = document.getElementById('agentId').value;
      const speakingTo = speakingToSelect.value;
      const rx = document.getElementById('rx').value;
      const resolutionDropdown = document.getElementById('resolutionDropdown').value;
      const resolutionText = document.getElementById('resolutionText').value;

      const resolutionSuffix = resolutionText ? ` - ${resolutionText}` : '';

      const note = `agt id: ${agentId}
agt speaking to: ${speakingTo}
agt call regarding: ${agent}
rx: ${rx}
res: advised agt to ${resolutionDropdown}${resolutionSuffix}`;

      const outputEl = document.getElementById('output');
      outputEl.value = note;
      // Do NOT auto-expand output; keep fixed height with scrollbar
      document.getElementById('noteModal').style.display = 'block';
    }

    function copyNote() {
      const output = document.getElementById('output');
      output.select();
      document.execCommand('copy');
    }

    function clearForm() {
      document.getElementById('agent').value = '';
      document.getElementById('agentId').value = '';
      document.getElementById('speakingTo').selectedIndex = 0; // reset to placeholder
      document.getElementById('rx').value = '';
      document.getElementById('resolutionDropdown').selectedIndex = 0;
      document.getElementById('resolutionText').value = '';
      document.getElementById('speakingToError').textContent = '';
      // Reset notes textarea height
      autoExpand(document.getElementById('resolutionText'));
    }

    function resetPage() {
      location.reload();
    }

    function closeModal() {
      document.getElementById('noteModal').style.display = 'none';
    }

    // Initialize notes auto-expanding behavior on load and input (output excluded)
    document.addEventListener('DOMContentLoaded', () => {
      const notes = document.getElementById('resolutionText');
      autoExpand(notes);
      notes.addEventListener('input', () => autoExpand(notes));
    });
  </script>
</body>
</html>
``
